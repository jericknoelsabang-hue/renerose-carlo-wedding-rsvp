name: Publish cleaned wedding attire guide
on:
  push:
    paths:
      - .github/workflows/publish-attire-guide.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out wedding website
        uses: actions/checkout@v4
      - name: Install image downloader and validator
        run: python -m pip install --quiet --disable-pip-version-check gdown pillow
      - name: Download edited wedding attire image
        run: |
          mkdir -p assets
          gdown "https://drive.google.com/uc?id=19Y4q0XT_p2oEIwsIgC78EeOA8w97te8N" -O assets/wedding-attire-no-heading.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          file=Path("assets/wedding-attire-no-heading.jpg")
          with Image.open(file) as image:
              image.verify()
          with Image.open(file) as image:
              assert image.size == (1024, 1536), f"Unexpected size: {image.size}"
          assert file.stat().st_size > 100000, "Unexpected small image file"
          print("Edited full-size attire guide validated.")
          PY
      - name: Commit image to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wedding-attire-no-heading.jpg
          if git diff --cached --quiet; then
            echo "Attire image is already present."
          else
            git commit -m "Publish attire image without duplicate heading"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
