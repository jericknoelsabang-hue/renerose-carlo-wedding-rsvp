name: Publish local hero reel

on:
  push:
    paths:
      - .github/workflows/publish-hero-reel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Download the supplied prenup reel
        run: |
          python -m pip install --quiet --disable-pip-version-check gdown
          gdown --id "1D1_zEB3e5Vg2USA7mVJh7Uh0FQVVARgq" --output /tmp/rose-carlo-original.mp4
          test -s /tmp/rose-carlo-original.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 /tmp/rose-carlo-original.mp4

      - name: Produce mobile-friendly silent HTML5 MP4
        run: |
          mkdir -p assets
          ffmpeg -y -hide_banner -loglevel error -i /tmp/rose-carlo-original.mp4 -map 0:v:0 -vf "scale=720:-2" -an -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p -movflags +faststart assets/rose-carlo-hero.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/rose-carlo-hero.mp4
          test -s assets/rose-carlo-hero.mp4

      - name: Commit the video to the website repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rose-carlo-hero.mp4
          if git diff --cached --quiet; then
            echo "Hero video already published."
          else
            git commit -m "Host the silent Renerose and Carlo hero reel on GitHub Pages"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
